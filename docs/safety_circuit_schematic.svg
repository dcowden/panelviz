<text x="1122" y="915" class="tiny" text-anchor="middle">D2..D9</text>
<text x="1610" y="875" class="tiny" text-anchor="middle">D10</text>
<text x="1618" y="1082" class="tiny" text-anchor="middle">D11</text>
<rect x="112" y="1208" width="980" height="135" class="note" />
<text x="140" y="1240" class="zoneTitle" text-anchor="start">Circuit check against mycnc.yml</text>
<text x="140" y="1270" class="small" text-anchor="start">- E-stops directly interrupt the COIL+ source before the contactor coils.</text>
<text x="140" y="1288" class="small" text-anchor="start">- K1 and K2 contactor coils are in parallel; both drop when COIL+ or COIL- opens.</text>
<text x="140" y="1306" class="small" text-anchor="start">- Arduino controls only the K3 low-side run relay and the K4 upper-limit indication relay.</text>
<text x="140" y="1324" class="small" text-anchor="start">- AXBB I6 observes actual coil voltage; AXBB I1 receives an upper-limit fault indication.</text>
<text x="140" y="1342" class="small" text-anchor="start">- No EDM feedback is shown because the contactors do not have NC aux contacts.</text>
</svg>