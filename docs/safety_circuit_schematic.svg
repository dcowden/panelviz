<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150" role="img" aria-label="PanelViz safety circuit electrical schematic">
  <defs>
    <style>
      :root {
        --wire: #e85d1f;
        --logic: #2563eb;
        --device: #1f2937;
        --muted: #6b7280;
        --panel: #ffffff;
        --fill: #fff7ed;
      }
      .sheet { fill: #fff; }
      .wire { stroke: var(--wire); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .logic { stroke: var(--logic); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .device { stroke: var(--device); stroke-width: 3; fill: var(--panel); stroke-linecap: round; stroke-linejoin: round; }
      .symbol { stroke: var(--device); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .contact { stroke: var(--device); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: var(--wire); stroke: var(--wire); }
      .logic-node { fill: var(--logic); stroke: var(--logic); }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 700 22px Arial, Helvetica, sans-serif; fill: #334155; }
      .label { font: 700 19px Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .pin { font: 700 15px Arial, Helvetica, sans-serif; fill: #111827; }
      .orange { fill: var(--wire); }
      .blue { fill: var(--logic); }
      .muted { fill: var(--muted); }
      .box-fill { fill: #f8fafc; }
      .warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
    </style>
  </defs>

  <rect class="sheet" x="0" y="0" width="1700" height="1150"/>
  <rect class="device" x="38" y="38" width="1624" height="1074" rx="0"/>
  <text class="title" x="70" y="88">Safety Circuit Schematic</text>
  <text class="small" x="70" y="116">PanelViz / mycnc.yml - control power, E-stop chain, Arduino permissive, contactor coils, AXBB status</text>

  <!-- Main 24V safety ladder -->
  <text class="subtitle" x="70" y="168">24V Contactor Coil Power</text>
  <line class="wire" x1="90" y1="220" x2="1550" y2="220"/>
  <line class="wire" x1="90" y1="555" x2="1550" y2="555"/>
  <text class="label orange" x="70" y="213">+24V</text>
  <text class="label orange" x="70" y="565">24V0</text>
  <circle class="node" cx="90" cy="220" r="7"/>
  <circle class="node" cx="90" cy="555" r="7"/>

  <!-- E-stop contacts in series -->
  <line class="wire" x1="150" y1="220" x2="230" y2="220"/>
  <g transform="translate(250 178)">
    <line class="contact" x1="0" y1="42" x2="34" y2="42"/>
    <line class="contact" x1="64" y1="42" x2="98" y2="42"/>
    <line class="contact" x1="34" y1="18" x2="64" y2="66"/>
    <text class="label" x="-4" y="-16">S1</text>
    <text class="small" x="-44" y="92">Primary E-stop</text>
    <text class="tiny" x="4" y="114">NC contact</text>
  </g>
  <line class="wire" x1="348" y1="220" x2="430" y2="220"/>
  <g transform="translate(450 178)">
    <line class="contact" x1="0" y1="42" x2="34" y2="42"/>
    <line class="contact" x1="64" y1="42" x2="98" y2="42"/>
    <line class="contact" x1="34" y1="18" x2="64" y2="66"/>
    <text class="label" x="-4" y="-16">S2</text>
    <text class="small" x="-56" y="92">Secondary E-stop</text>
    <text class="tiny" x="4" y="114">NC contact</text>
  </g>
  <line class="wire" x1="548" y1="220" x2="675" y2="220"/>
  <circle class="node" cx="675" cy="220" r="7"/>
  <text class="label orange" x="648" y="198">COIL+</text>
  <text class="tiny" x="624" y="246">coil_t positions 1-4</text>

  <!-- Contactor coils in parallel -->
  <line class="wire" x1="675" y1="220" x2="675" y2="292"/>
  <line class="wire" x1="675" y1="292" x2="820" y2="292"/>
  <line class="wire" x1="675" y1="292" x2="675" y2="420"/>
  <line class="wire" x1="675" y1="420" x2="820" y2="420"/>
  <g transform="translate(820 250)">
    <rect class="device" x="0" y="0" width="190" height="84" rx="10"/>
    <path class="symbol" d="M28 42 C42 10, 68 74, 84 42 S124 10, 146 42"/>
    <text class="pin" x="-26" y="19">A1</text>
    <text class="pin" x="198" y="70">A2</text>
    <text class="label" x="58" y="-16">K110</text>
    <text class="small" x="48" y="110">110V contactor coil</text>
  </g>
  <line class="wire" x1="1010" y1="292" x2="1135" y2="292"/>
  <g transform="translate(820 378)">
    <rect class="device" x="0" y="0" width="190" height="84" rx="10"/>
    <path class="symbol" d="M28 42 C42 10, 68 74, 84 42 S124 10, 146 42"/>
    <text class="pin" x="-26" y="19">A1</text>
    <text class="pin" x="198" y="70">A2</text>
    <text class="label" x="58" y="-16">K220</text>
    <text class="small" x="48" y="110">220V contactor coil</text>
  </g>
  <line class="wire" x1="1010" y1="420" x2="1135" y2="420"/>
  <line class="wire" x1="1135" y1="292" x2="1135" y2="420"/>
  <line class="wire" x1="1135" y1="356" x2="1240" y2="356"/>
  <circle class="node" cx="1135" cy="356" r="7"/>
  <text class="label orange" x="1105" y="270">COIL-</text>
  <text class="tiny" x="1064" y="448">coil_t positions 5-8</text>

  <!-- Run relay NO contact in coil return -->
  <g transform="translate(1240 314)">
    <line class="contact" x1="0" y1="42" x2="34" y2="42"/>
    <line class="contact" x1="64" y1="42" x2="98" y2="42"/>
    <line class="contact" x1="34" y1="42" x2="64" y2="18"/>
    <text class="label" x="8" y="-16">K_RUN</text>
    <text class="small" x="-8" y="92">NO run contact</text>
  </g>
  <line class="wire" x1="1338" y1="356" x2="1450" y2="356"/>
  <line class="wire" x1="1450" y1="356" x2="1450" y2="555"/>
  <circle class="node" cx="1450" cy="555" r="7"/>

  <!-- AXBB coil sense -->
  <g transform="translate(1230 170)">
    <rect class="device box-fill" x="0" y="0" width="270" height="88" rx="8"/>
    <text class="label" x="24" y="34">AXBB-E I6</text>
    <text class="small" x="24" y="62">coil energized status</text>
  </g>
  <line class="wire" x1="675" y1="220" x2="1230" y2="220"/>
  <line class="wire" x1="1135" y1="292" x2="1230" y2="292"/>
  <line class="wire" x1="1230" y1="220" x2="1230" y2="210"/>
  <line class="wire" x1="1230" y1="292" x2="1230" y2="246"/>
  <text class="pin" x="1200" y="214">I6+</text>
  <text class="pin" x="1200" y="280">I6-</text>

  <!-- Reset lamp rung -->
  <text class="subtitle" x="70" y="638">Reset Lamp</text>
  <line class="wire" x1="90" y1="700" x2="220" y2="700"/>
  <g transform="translate(220 662)">
    <circle class="symbol" cx="42" cy="38" r="30"/>
    <line class="symbol" x1="22" y1="18" x2="62" y2="58"/>
    <line class="symbol" x1="62" y1="18" x2="22" y2="58"/>
    <text class="label" x="-6" y="-16">H1</text>
    <text class="small" x="-42" y="86">reset lamp</text>
  </g>
  <line class="wire" x1="292" y1="700" x2="430" y2="700"/>
  <g transform="translate(450 658)">
    <line class="contact" x1="0" y1="42" x2="34" y2="42"/>
    <line class="contact" x1="64" y1="42" x2="98" y2="42"/>
    <line class="contact" x1="34" y1="66" x2="64" y2="18"/>
    <text class="label" x="8" y="-16">K_RUN</text>
    <text class="small" x="-2" y="92">NC contact</text>
  </g>
  <line class="wire" x1="548" y1="700" x2="1450" y2="700"/>
  <line class="wire" x1="1450" y1="700" x2="1450" y2="555"/>

  <!-- Arduino/control logic -->
  <text class="subtitle" x="70" y="815">5V Logic and Permissive Control</text>
  <rect class="device box-fill" x="70" y="850" width="520" height="210" rx="12"/>
  <text class="label" x="104" y="890">AL-ZARD opto board</text>
  <text class="small" x="104" y="924">UL OK inputs: X1, X2, Y, Z</text>
  <text class="small" x="104" y="954">Driver alarm OK inputs: X1, X2, Y, Z</text>
  <text class="tiny" x="104" y="986">HIGH = OK, LOW = fault/disconnected</text>
  <line class="logic" x1="590" y1="930" x2="710" y2="930"/>
  <polygon points="710,930 690,918 690,942" fill="#2563eb"/>

  <rect class="device box-fill" x="710" y="810" width="410" height="300" rx="12"/>
  <text class="label" x="748" y="852">Alarm Limit Board</text>
  <text class="small" x="748" y="882">Arduino Nano run-permissive logic</text>
  <text class="small" x="748" y="922">D2-D5: upper limits OK</text>
  <text class="small" x="748" y="952">D6-D9: driver alarms OK</text>
  <text class="small" x="748" y="982">D10: K_RUN relay module input</text>
  <text class="small" x="748" y="1012">D11: K_UL_OK relay module input</text>
  <text class="small" x="748" y="1042">D12: reset button, INPUT_PULLUP</text>

  <!-- Reset pushbutton to Arduino -->
  <line class="logic" x1="90" y1="770" x2="250" y2="770"/>
  <g transform="translate(250 728)">
    <line class="contact" x1="0" y1="42" x2="34" y2="42"/>
    <line class="contact" x1="64" y1="42" x2="98" y2="42"/>
    <line class="contact" x1="34" y1="18" x2="64" y2="42"/>
    <text class="label" x="14" y="-16">S3</text>
    <text class="small" x="-42" y="92">Reset pushbutton</text>
    <text class="tiny" x="-4" y="114">NO, pulls D12 to 5V0</text>
  </g>
  <line class="logic" x1="348" y1="770" x2="910" y2="770"/>
  <line class="logic" x1="910" y1="770" x2="910" y2="810"/>
  <text class="pin blue" x="875" y="763">D12</text>
  <text class="label blue" x="70" y="763">5V0</text>

  <!-- Relay module outputs from Arduino -->
  <line class="logic" x1="1120" y1="982" x2="1230" y2="982"/>
  <line class="logic" x1="1230" y1="982" x2="1230" y2="402"/>
  <text class="pin blue" x="1130" y="970">D10</text>
  <text class="tiny" x="1238" y="520">energize K_RUN</text>

  <line class="logic" x1="1120" y1="1012" x2="1320" y2="1012"/>
  <text class="pin blue" x="1130" y="1002">D11</text>
  <rect class="device box-fill" x="1320" y="920" width="270" height="120" rx="8"/>
  <text class="label" x="1344" y="956">K_UL_OK</text>
  <text class="small" x="1344" y="986">upper-limits-ok relay</text>
  <text class="tiny" x="1344" y="1014">NC contact drives AXBB I1 fault</text>

  <!-- AXBB I1 fault indication rung -->
  <line class="wire" x1="90" y1="1080" x2="1210" y2="1080"/>
  <text class="label orange" x="70" y="1072">+24V</text>
  <rect class="device box-fill" x="1210" y="1042" width="160" height="76" rx="8"/>
  <text class="label" x="1244" y="1074">AXBB I1</text>
  <text class="tiny" x="1238" y="1098">upper limit fault</text>
  <line class="wire" x1="1370" y1="1080" x2="1425" y2="1080"/>
  <g transform="translate(1425 1038)">
    <line class="contact" x1="0" y1="42" x2="34" y2="42"/>
    <line class="contact" x1="64" y1="42" x2="98" y2="42"/>
    <line class="contact" x1="34" y1="66" x2="64" y2="18"/>
    <text class="label" x="-10" y="-14">K_UL_OK</text>
    <text class="tiny" x="-8" y="88">NC opens when limits OK</text>
  </g>
  <line class="wire" x1="1523" y1="1080" x2="1550" y2="1080"/>
  <line class="wire" x1="1550" y1="1080" x2="1550" y2="555"/>

  <!-- Notes / title block -->
  <rect class="warn" x="1170" y="735" width="410" height="135" rx="8"/>
  <text class="label" x="1194" y="770">Design note</text>
  <text class="small" x="1194" y="802">K_RUN is Arduino-maintained seal-in logic.</text>
  <text class="small" x="1194" y="828">Physical E-stop contacts directly remove COIL+.</text>
  <text class="tiny" x="1194" y="854">Not a certified safety relay / EDM circuit.</text>

  <rect class="device" x="1180" y="48" width="455" height="95" rx="0"/>
  <line class="symbol" x1="1180" y1="84" x2="1635" y2="84"/>
  <line class="symbol" x1="1370" y1="48" x2="1370" y2="143"/>
  <line class="symbol" x1="1510" y1="84" x2="1510" y2="143"/>
  <text class="tiny" x="1192" y="72">TITLE</text>
  <text class="label" x="1192" y="116">Safety Circuit</text>
  <text class="tiny" x="1382" y="72">FILE</text>
  <text class="small" x="1382" y="116">mycnc.yml</text>
  <text class="tiny" x="1522" y="108">DATE</text>
  <text class="small" x="1522" y="132">2026-05-25</text>
</svg>
