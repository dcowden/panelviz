    type: pcb
    tags: [safety]
    size:
      width: 2.2
      height: 1.6
    pins:
      top: [D13, 3V3, REF, A0, A1, A2, A3, A4, A5, A6, A7, RST, GND, 5V]
      bottom: [D12, D11, D10, D9, D8, D7, D6, D5, D4, D3, D2, 5V0, RST2, RX TX]
    nets:
      - name: X1UL_OK
        pins: [D2]
      - name: X2UL_OK
        pins: [D3]
      - name: YUL_OK
        pins: [D4]
      - name: ZUL_OK
        pins: [D5]
      - name: X1_ALM_OK
        pins: [D6]
      - name: X2_ALM_OK
        pins: [D7]
      - name: Y_ALM_OK
        pins: [D8]
      - name: Z_ALM_OK
        pins: [D9]
      - name: RUN_RELAY_CTL
        pins: [D10]
      - name: UPPER_LIMITS_OK_RELAY_CTL
        pins: [D11]
      - name: RESET_SW
