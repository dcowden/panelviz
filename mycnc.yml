connections:
  wires:
    - from: wall_plug.GND
      to: vfd_earth.earth
      net: earth
      awg: 12
    - from: wall_plug.1
      to: wall_power_t.1A
      net: 110L
      awg: 12
    - from: wall_power_t.1B
      to: power_switch.L_IN
      net: 110L
      awg: 12
    - from: power_switch.L_OUT
      to: breaker.L_IN
      net: 110L
      awg: 12
    - from: breaker.L_OUT
      to: live_power_t.110L
      net: 110L
      awg: 12
    - from: wall_plug.2
      to: live_power_t.110N
      net: 110N
      awg: 12
    - [live_power_t.110L, transformer.110L]
    - [live_power_t.110N, transformer.110N]
    - [live_power_t.110L, contactor_110.T2]
    - [live_power_t.110N, contactor_110.T3]
    - [transformer.GND, vfd_earth.earth]
    - [transformer.220L, contactor_220.T1]
    - [transformer.220N, contactor_220.T2]
    - [contactor_110.L2, switched_110L.110L_SWITCHED]
    - [contactor_110.L3, switched_110N.110N_SWITCHED]
    - [48v.GND, vfd_earth.earth]
    - [24v.GND, dc_power_earth.earth]
    - [24v.110N, live_power_t.110N]
    - [24v.110L, live_power_t.110L]
    - [5v.110N, live_power_t.110N]
    - [5v.110L, live_power_t.110L]
    - [5v.GND, dc_power_earth.earth]
    - [48v.110L, switched_110L.110L_SWITCHED]
    - [36V_X1.110N, switched_110N.110N_SWITCHED]
    - [36V_X1.110L, switched_110L.110L_SWITCHED]
    - [36V_X1.GND, vfd_earth.earth]
    - [36V_X1.36V_X1, driver_power.36V_X1]
    - [36V_X1.36V0_X1, driver_power.36V0_X1]
    - [36V_X2.GND, vfd_earth.earth]
    - [36V_X2.110N, switched_110N.110N_SWITCHED]
    - [36V_X2.110L, switched_110L.110L_SWITCHED]
    - [36V_X2.36V_X2, driver_power.36V_X2]
    - [36V_X2.36V0_X2, driver_power.36V0_X2]
    - [48v.DRIVER_48V, driver_power.DRIVER_48V]
    - [48v.DRIVER_GND, driver_power.DRIVER_GND]
    - [contactor_110.A1, coil_t.COIL+]
    - [contactor_220.A1, coil_t.COIL+]
    - [contactor_110.A2, coil_t.COIL-]
    - [contactor_220.A2, coil_t.COIL-]
    - [vfd.GND, vfd_earth.earth]
    - route: [48v.110N, switched_110N.110N_SWITCHED]
      net: 110N_SWITCHED

    - route: [z_motor.ma+, cnc_terminals.1, Z_cl57s.A+]
      awg: 16
    - route: [z_motor.ma-, cnc_terminals.2, Z_cl57s.A-]
      awg: 16
    - route: [z_motor.mb+, cnc_terminals.3, Z_cl57s.B+]
      awg: 16
